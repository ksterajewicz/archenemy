# =============================================
#   archenemy · warstwa WSPÓLNA · mpd (demon użytkownika)
#   ~/.config/mpd -> ~/archenemy/config/mpd (symlink z install.sh [8l]).
#   Trackowany jest TYLKO ten plik:
#     output.conf — warstwa MASZYNOWA: wyjście audio (pipewire / alsa),
#                   generowane przez install.sh, przepisywane przez
#                   Super+A -> [o]; gitignore
#     local.conf  — warstwa OSOBISTA: własne nadpisania (inna ścieżka
#                   muzyki, dodatkowe wyjścia); gitignore
#   Stan mpd (baza, playlisty, state) leży w ~/.local/state/mpd/ —
#   nic nie jest zapisywane do repozytorium.
#   Usługa: systemctl --user enable --now mpd.service (log: journalctl --user -u mpd)
# =============================================

music_directory     "~/Music"
playlist_directory  "~/.local/state/mpd/playlists"
db_file             "~/.local/state/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/state/mpd/sticker.sql"

bind_to_address     "localhost"
auto_update         "yes"
# Po restarcie (np. z Super+A -> [o]) mpd wraca w pauzie, nie gra sam.
restore_paused      "yes"

# Wyjście fifo = dane dla wizualizera ncmpcpp (visualizer_data_source
# i visualizer_output_name w rices/*/ncmpcpp/config). Niezależne od trybu
# wyjścia głównego.
audio_output {
    type    "fifo"
    name    "Visualizer feed"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}

# Wyjście główne (pipewire zalecane; alsa = tryb wyłączny, patrz README).
include           "output.conf"
# Twoje nadpisania — plik może nie istnieć.
include_optional  "local.conf"
