# archenemy - system-theme.conf (crt rice)
# Deklaracja: wygląd tego rice'a poza sesją — ekran logowania SDDM i menu
# startu GRUB-a. Czyta src/system-theme/build.sh (plik jest czytany jako
# dane, nigdy wykonywany). NIE jest symlinkowany do ~/.config (przełącznik
# linkuje tylko katalogi) — to metadane rice'a, nie config aplikacji.
# Układ ekranu logowania: src/system-theme/sddm/crt/.
#
# Tło ekranu logowania, gdy użytkownik nie ustawił własnej tapety:
# plik dla ekranów 16:9 i szerszych oraz dla wyższych (16:10).
SDDM_WALLPAPER_169="wallpapers/crt/crt-scope-v1-1920x1080.png"
SDDM_WALLPAPER_1610="wallpapers/crt/crt-scope-v2-2560x1600.png"
# Menu GRUB-a: jednolite tło, logo systemu, lista. Paleta crt: granat
# #031533, błękit #5695D6, fosfor #74DCE2 dla zaznaczonej pozycji.
GRUB_BACKGROUND="#031533"
GRUB_TEXT="#5695D6"
GRUB_SELECTED="#74DCE2"
GRUB_DIM="#3069AD"
GRUB_ACCENT="#36D2D8"
GRUB_FILL="#06224A"
GRUB_LOGO="#74DCE2"
# frame = zaznaczona pozycja w ramce akcentu; bar = kreska akcentu po lewej.
GRUB_SELECT="frame"
