# archenemy - flux-wall.conf (crt rice)
# Deklaracja: ten rice zna tapetę liczoną shaderem (flux-wall) — nad tapetą
# hyprpapera, pod oknami. Czyta scripts/wallpapers/flux-wall.sh. Plik NIE jest
# symlinkowany do ~/.config (przełącznik linkuje tylko katalogi) — to metadane
# rice'a, nie config aplikacji.
#
# Paleta fosforu: zgaszony kineskop #031533, błękit #3069AD, cyjan #36D2D8
# jako akcent — animacje z Super+W przechodzą w kolory tego rice'a.
FLUX_WALL_PALETTE="031533,3069AD,36D2D8"
FLUX_WALL_SHADER="src/flux-wall/shaders/dither-flux.frag"
# --battery: szczegółowość i tempo maleją wraz z poziomem baterii.
FLUX_WALL_ARGS="--battery"
# 0 = animacja domyślnie WYŁĄCZONA (tożsamością rice'a jest shader ekranowy
# i statyczna tapeta „test pattern"); włączasz w Super+W → Animations/.
# Wybór użytkownika w data/flux-wall.dat ma pierwszeństwo.
FLUX_WALL_AUTOSTART=0
# 0 = gładki gradient palety, bez rastra Bayera — w każdej animacji
# (raster tylko w ricu dither-flux; brak klucza też znaczy 0).
FLUX_WALL_DITHER=0
