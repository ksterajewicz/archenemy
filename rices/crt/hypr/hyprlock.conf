# archenemy - hyprlock.conf (crt rice)
# made by kst - https://github.com/ksterajewicz

general {
    hide_cursor       = true
    ignore_empty_input = true
}

# Tło (warstwa maszynowa — Super+W -> "Set as hyprlock background" je zmienia
# bez ruszania tego pliku; generowane przez install.sh [8h] przy pierwszym
# biegu, z brightness=0.60 — zgaszony kineskop, nad nim świecący zegar).
source = ~/archenemy/config/hypr/hyprlock-background-crt.conf

# ─── Dwie linie w błękicie ramujące zegar (1 px — jak ramki okien) ──
shape {
    monitor     =
    size        = 560, 1
    color       = rgba(48, 105, 173, 0.80)
    rounding    = 0
    border_size = 0
    position    = 0, 258
    halign      = center
    valign      = center
}
shape {
    monitor     =
    size        = 560, 1
    color       = rgba(48, 105, 173, 0.80)
    rounding    = 0
    border_size = 0
    position    = 0, 92
    halign      = center
    valign      = center
}

# ─── Clock ────────────────────────────────────────────
label {
    monitor =
    text          = $TIME
    # Cyjan fosforu — najjaśniejszy kolor palety, z poświatą (hyprlock nie ma
    # text-shadow; poświatę daje shadow_passes/shadow_size etykiety).
    color         = rgba(116, 220, 226, 0.97)
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(54, 210, 216, 0.55)
    font_size     = 100
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 175
    halign        = center
    valign        = center
}

label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(86, 149, 214, 0.95)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 52
    halign      = center
    valign      = center
}

# ─── Tagline ─────────────────────────────────────────
label {
    monitor       =
    text          = · C R T ·
    color         = rgba(48, 105, 173, 0.90)
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 18
    halign        = center
    valign        = center
}

# ─── Password field ──────────────────────────────────
input-field {
    monitor =
    size              = 300, 52
    position          = 0, -80
    halign            = center
    valign            = center

    rounding          = 4
    outline_thickness = 1

    inner_color       = rgba(3, 21, 51, 0.60)
    outer_color       = rgba(54, 210, 216, 0.85)
    check_color       = rgba(86, 149, 214, 0.9)
    # Fail w bursztynie — fosfor alarmowy, jedyny ciepły kolor palety.
    fail_color        = rgba(255, 176, 0, 0.9)
    font_color        = rgb(116, 220, 226)

    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>password…</i>
    fail_text         = <i>wrong ($ATTEMPTS)</i>

    dots_size         = 0.25
    dots_spacing      = 0.25
    dots_center       = true

    fade_on_empty     = true
    fade_timeout      = 1500
}
