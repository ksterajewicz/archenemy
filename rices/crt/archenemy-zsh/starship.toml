# =============================================
#   archenemy · crt · Starship
#   Tło terminala: #031533; tylko szybkie moduły i znaki ASCII.
# =============================================
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = '$directory$git_branch$git_status$cmd_duration$line_break$character'
scan_timeout = 30
command_timeout = 200

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#36D2D8'
read_only = ' ro'
read_only_style = '#FFB000'
truncation_length = 3
truncation_symbol = '../'

[git_branch]
format = '[$symbol$branch]($style) '
symbol = 'git:'
style = '#5695D6'
truncation_length = 28
truncation_symbol = '...'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = '#FFB000'
conflicted = '='
ahead = 'a${count}'
behind = 'b${count}'
diverged = 'a${ahead_count}/b${behind_count}'
up_to_date = ''
untracked = '?'
stashed = 's'
modified = '!'
staged = '+'
renamed = 'r'
deleted = 'x'
ignore_submodules = true

[cmd_duration]
format = '[$duration]($style) '
min_time = 2000
style = '#5695D6'
show_notifications = false

[character]
format = '$symbol '
success_symbol = '[>](#36D2D8)'
error_symbol = '[!](#FFB000)'
vimcmd_symbol = '[<](#36D2D8)'
vimcmd_replace_one_symbol = '[r](#FFB000)'
vimcmd_replace_symbol = '[R](#FFB000)'
vimcmd_visual_symbol = '[v](#36D2D8)'
