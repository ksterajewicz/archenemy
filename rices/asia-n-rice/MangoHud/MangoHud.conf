################################################################################
#   ~/.config/MangoHud/MangoHud.conf
#   Gaming diagnostics — small, dark, readable (asia-n-rice: mauve na granacie)
################################################################################

# ─── POSITION & SIZE ──────────────────────────────────────────────────────
position=top-left
font_size=18
table_columns=14
gpu_text=GPU
cpu_text=CPU
round_corners=14

# ─── TOGGLE KEYS ──────────────────────────────────────────────────────────
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

# ─── FRAME PERFORMANCE (najważniejsze pod GPU diagnostykę) ───────────────
fps
fps_limit=0,60,144,240
frame_timing=1
fps_color_change
fps_value=30,60,120
fps_color=d9738a,d0a67a,7ea88f

# ─── GPU ──────────────────────────────────────────────────────────────────
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
vram
gpu_load_change
gpu_load_value=60,90
gpu_load_color=7ea88f,d0a67a,d9738a

# ─── CPU ──────────────────────────────────────────────────────────────────
cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_load_change
cpu_load_value=60,90
cpu_load_color=7ea88f,d0a67a,d9738a

# Per-core (przydatne ale rzadko, włącz w razie problemów)
# core_load
# core_load_change

# ─── RAM / IO ─────────────────────────────────────────────────────────────
ram
swap
io_read
io_write

# ─── PROCES / GRA ─────────────────────────────────────────────────────────
engine_version
vulkan_driver
wine
gamemode
exec_name
arch

# ─── LATENCY (krytyczne dla FPS gier) ────────────────────────────────────
present_mode
gpu_voltage

# ─── NETWORK / BATTERY (laptop) ──────────────────────────────────────────
battery
# network bez nazwy = wszystkie interfejsy; nazwa (np. wlo1) to dane maszyny, nie rice'a
network

# ─── HUD STYLING — granat, mauve, rogi 14px jak mako/rofi/swayosd ────────
# Progi fps/obciążenia jak w white-blue (zielony → żółty → alarm), ale w
# przygaszonych kolorach ANSI rice'a; #d9738a = urgent rice'a. Kontrast do
# tła #182130 ≥ 4,5:1 (najsłabszy mauve #b47687: 4,5:1).
background_alpha=0.55
alpha=0.85
background_color=182130
text_color=e8e8e8
gpu_color=e8e8e8
cpu_color=e8e8e8
vram_color=a3b5cf
ram_color=a3b5cf
engine_color=b47687
io_color=b47687
frametime_color=c98a99
media_player_color=b47687

# ─── LOGGING (do późniejszej analizy) ────────────────────────────────────
output_folder=$HOME/MangoHudLogs
log_duration=60
autostart_log=0
log_interval=100
log_versioning
