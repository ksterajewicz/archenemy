# archenemy - flux-wall.conf (asia-n-rice rice)
# Paleta dla tapety liczonej shaderem (flux-wall), gdy użytkownik wybierze
# animację w Super+W. Ten rice NIE uruchamia jej domyślnie (AUTOSTART=0) —
# zachowanie rice'a bez wyboru użytkownika jest bez zmian.
# Mauve na granacie — tło #2a3444, mauve #b47687 jako atrament,
# jaśniejszy mauve jako akcent (kolory z motywu rice'a).
FLUX_WALL_PALETTE="2A3444,B47687,E0B0BD"
FLUX_WALL_SHADER="src/flux-wall/shaders/dither-flux.frag"
FLUX_WALL_ARGS="--battery"
FLUX_WALL_AUTOSTART=0
# 0 = gładki gradient palety, bez rastra Bayera — w każdej animacji
# (raster tylko w ricu dither-flux; brak klucza też znaczy 0).
FLUX_WALL_DITHER=0
