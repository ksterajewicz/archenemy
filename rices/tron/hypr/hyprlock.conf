# archenemy - hyprlock.conf (tron rice)
# made by kst - https://github.com/ksterajewicz

general {
    hide_cursor       = true
    ignore_empty_input = true
}

background {
    monitor =
    path       = screenshot
    blur_size  = 7
    blur_passes = 3
    noise      = 0.012
    contrast   = 1.05
    # Ciemniej niż w white-blue — blokada ma wyglądać jak zgaszony Grid.
    brightness = 0.55
    vibrancy   = 0.18
}

# ─── Neonowe linie HUD ramujące zegar (siatka Gridu) ──
# (bez shadow_* na shape — trzymamy się pewnych kluczy, żeby nie ryzykować
#  błędu parsera na ekranie blokady; poświatę niesie sam jasny cyjan)
shape {
    monitor     =
    size        = 560, 2
    color       = rgba(0, 229, 255, 0.55)
    rounding    = 0
    border_size = 0
    position    = 0, 258
    halign      = center
    valign      = center
}
shape {
    monitor     =
    size        = 560, 2
    color       = rgba(0, 229, 255, 0.55)
    rounding    = 0
    border_size = 0
    position    = 0, 92
    halign      = center
    valign      = center
}

# ─── Clock ────────────────────────────────────────────
label {
    monitor =
    text          = $TIME
    # Neon cyjan z podwójną poświatą (glow) — sygnatura estetyki Tron: Legacy.
    color         = rgba(0, 229, 255, 0.97)
    font_size     = 100
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 175
    halign        = center
    valign        = center
    shadow_passes = 4
    shadow_size   = 10
    shadow_color  = rgba(0, 229, 255, 0.55)
}

label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(207, 238, 247, 0.85)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 52
    halign      = center
    valign      = center
}

# ─── Tagline „WELCOME TO THE GRID" ────────────────────
label {
    monitor       =
    text          = · W E L C O M E   T O   T H E   G R I D ·
    color         = rgba(0, 229, 255, 0.55)
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 18
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 229, 255, 0.30)
}

# ─── Password field ──────────────────────────────────
input-field {
    monitor =
    size              = 300, 52
    position          = 0, -80
    halign            = center
    valign            = center

    rounding          = 6
    outline_thickness = 2

    inner_color       = rgba(2, 10, 15, 0.55)
    outer_color       = rgba(0, 229, 255, 0.85)
    check_color       = rgba(125, 249, 255, 0.9)
    # Fail w pomarańczu CLU — kolor semantyczny rice'a tron.
    fail_color        = rgba(255, 123, 28, 0.9)
    font_color        = rgb(207, 238, 247)

    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>password…</i>
    fail_text         = <i>wrong ($ATTEMPTS)</i>

    dots_size         = 0.25
    dots_spacing      = 0.25
    dots_center       = true

    fade_on_empty     = true
    fade_timeout      = 1500
}
