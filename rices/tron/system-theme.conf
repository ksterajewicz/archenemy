# archenemy - system-theme.conf (tron rice)
# Deklaracja: wygląd tego rice'a poza sesją — ekran logowania SDDM i menu
# startu GRUB-a. Czyta src/system-theme/build.sh (plik jest czytany jako
# dane, nigdy wykonywany). NIE jest symlinkowany do ~/.config (przełącznik
# linkuje tylko katalogi) — to metadane rice'a, nie config aplikacji.
# Układ ekranu logowania: src/system-theme/sddm/tron/.
#
# Tło ekranu logowania, gdy użytkownik nie ustawił własnej tapety:
# plik dla ekranów 16:9 i szerszych oraz dla wyższych (16:10).
SDDM_WALLPAPER_169="wallpapers/tron-grid/tron-grid-v1-1920x1080.png"
SDDM_WALLPAPER_1610="wallpapers/tron-grid/tron-grid-v2-2560x1600.png"
# Menu GRUB-a: jednolite tło, logo systemu, lista. Paleta trona: pustka
# #020A0F, cyjan #00E5FF jako akcent, jasny cyjan dla zaznaczonej pozycji.
GRUB_BACKGROUND="#020A0F"
GRUB_TEXT="#9ADBE8"
GRUB_SELECTED="#7DF9FF"
GRUB_DIM="#4A7A8A"
GRUB_ACCENT="#00E5FF"
GRUB_FILL="#04202A"
GRUB_LOGO="#00E5FF"
# frame = zaznaczona pozycja w ramce akcentu; bar = kreska akcentu po lewej.
GRUB_SELECT="frame"
