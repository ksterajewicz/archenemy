################################################################################
#   ~/.config/MangoHud/MangoHud.conf
#   Gaming diagnostics — small, light, readable (yang rice: papier, szarości, czerń)
################################################################################

# ─── POSITION & SIZE ──────────────────────────────────────────────────────
position=top-left
font_size=18
table_columns=14
gpu_text=GPU
cpu_text=CPU
round_corners=4

# ─── TOGGLE KEYS ──────────────────────────────────────────────────────────
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

# ─── FRAME PERFORMANCE (najważniejsze pod GPU diagnostykę) ───────────────
fps
fps_limit=0,60,144,240
frame_timing=1
fps_color_change
fps_value=30,60,120
fps_color=a23a10,7e2e0e,0c0c0e

# ─── GPU ──────────────────────────────────────────────────────────────────
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
vram
gpu_load_change
gpu_load_value=60,90
gpu_load_color=0c0c0e,7e2e0e,a23a10

# ─── CPU ──────────────────────────────────────────────────────────────────
cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_load_change
cpu_load_value=60,90
cpu_load_color=0c0c0e,7e2e0e,a23a10

# Per-core (przydatne ale rzadko, włącz w razie problemów)
# core_load
# core_load_change

# ─── RAM / IO ─────────────────────────────────────────────────────────────
ram
swap
io_read
io_write

# ─── PROCES / GRA ─────────────────────────────────────────────────────────
engine_version
vulkan_driver
wine
gamemode
exec_name
arch

# ─── LATENCY (krytyczne dla FPS gier) ────────────────────────────────────
present_mode
gpu_voltage

# ─── NETWORK / BATTERY (laptop) ──────────────────────────────────────────
battery
# network bez nazwy = wszystkie interfejsy; nazwa (np. wlo1) to dane maszyny, nie rice'a
network

# ─── HUD STYLING — papier, szarości i czerń ─────────────────────────────
# Jasna płyta jest gęstsza niż w yin (0.55), a tekst nieprzezroczysty: pod
# HUD-em bywa ciemna scena gry, a tekst jest ciemny. Nad czarną sceną płyta
# = #DBDBDC: tekst #232327 11,3:1, popiół #5E5E66 4,6:1, rdza 4,8:1.
background_alpha=0.90
alpha=1.0
background_color=f3f3f5
text_color=232327
gpu_color=232327
cpu_color=232327
vram_color=5e5e66
ram_color=5e5e66
engine_color=5e5e66
io_color=5e5e66
frametime_color=0c0c0e
media_player_color=5e5e66

# ─── LOGGING (do późniejszej analizy) ────────────────────────────────────
output_folder=$HOME/MangoHudLogs
log_duration=60
autostart_log=0
log_interval=100
log_versioning
