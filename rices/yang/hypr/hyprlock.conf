# archenemy - hyprlock.conf (yang rice)
# made by kst - https://github.com/ksterajewicz

general {
    hide_cursor       = true
    ignore_empty_input = true
}

# Tło (warstwa maszynowa — Super+W -> "Set as hyprlock background" je zmienia
# bez ruszania tego pliku; generowane przez install.sh [8h] przy pierwszym
# biegu, z brightness=1.00 — jasny, rozmyty pulpit bez przygaszania, nad nim
# tafla jasnego szkła).
source = ~/archenemy/config/hypr/hyprlock-background-yang.conf

# ─── Tafla jasnego matowego szkła pod zegarem i polem hasła ───
# Mleko z alfą 0.80 nad rozmytym tłem (gęściej niż 0.55 w yin: pod jasną
# taflą może leżeć ciemne okno ze zrzutu, a tekst jest ciemny), krawędź =
# czarna linia 1 px (alfa 0.12), miękki cień. Rogi 24 px = 2 × promień okien.
# Kontrast nawet nad czarnym zrzutem (tafla efektywnie #BEBEC1): zegar
# #0C0C0E 10,5:1, data #3B3B41 6,0:1, podpis #46464C 5,1:1.
shape {
    monitor       =
    size          = 520, 400
    color         = rgba(238, 238, 241, 0.80)
    rounding      = 24
    border_size   = 1
    border_color  = rgba(12, 12, 14, 0.12)
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.18)
    position      = 0, 60
    halign        = center
    valign        = center
}

# ─── Clock ────────────────────────────────────────────
label {
    monitor =
    text        = $TIME
    # Czerń — akcent rice'a; bez poświaty (yang to szkło, nie neon).
    color       = rgba(12, 12, 14, 1.0)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 160
    halign      = center
    valign      = center
}

label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(59, 59, 65, 1.0)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 52
    halign      = center
    valign      = center
}

# ─── Tagline ─────────────────────────────────────────
label {
    monitor       =
    text          = · Y A N G ·
    color         = rgba(70, 70, 76, 1.0)
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 16
    halign        = center
    valign        = center
}

# ─── Password field ──────────────────────────────────
input-field {
    monitor =
    size              = 300, 52
    position          = 0, -80
    halign            = center
    valign            = center

    rounding          = 12
    outline_thickness = 1

    inner_color       = rgba(243, 243, 245, 0.85)
    outer_color       = rgba(12, 12, 14, 0.45)
    check_color       = rgba(59, 59, 65, 0.90)
    # Fail w rdzy — jedyny ciepły kolor palety, wyłącznie alarmy.
    fail_color        = rgba(162, 58, 16, 0.95)
    font_color        = rgb(12, 12, 14)

    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>password…</i>
    fail_text         = <i>wrong ($ATTEMPTS)</i>

    dots_size         = 0.25
    dots_spacing      = 0.25
    dots_center       = true

    fade_on_empty     = true
    fade_timeout      = 1500
}
