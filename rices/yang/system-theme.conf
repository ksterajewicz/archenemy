# archenemy - system-theme.conf (yang rice)
# Deklaracja: wygląd tego rice'a poza sesją — ekran logowania SDDM i menu
# startu GRUB-a. Czyta src/system-theme/build.sh (plik jest czytany jako
# dane, nigdy wykonywany). NIE jest symlinkowany do ~/.config (przełącznik
# linkuje tylko katalogi) — to metadane rice'a, nie config aplikacji.
# Układ ekranu logowania: src/system-theme/sddm/yang/.
#
# Tło ekranu logowania: formularz yang jest wpasowany w tarczę zaćmienia,
# więc te dwa pliki są tłem zawsze (theme.conf: followWallpaper=0).
SDDM_WALLPAPER_169="wallpapers/yang/yang-eclipse-v1-1920x1080.png"
SDDM_WALLPAPER_1610="wallpapers/yang/yang-eclipse-v2-2560x1600.png"
# Menu GRUB-a: jednolite tło, logo systemu, lista. Paleta yang: biel
# #F3F3F5, grafit #46464C, czerń #0C0C0E jako jedyny akcent.
GRUB_BACKGROUND="#F3F3F5"
GRUB_TEXT="#46464C"
GRUB_SELECTED="#0C0C0E"
GRUB_DIM="#8C8C96"
GRUB_ACCENT="#0C0C0E"
GRUB_FILL="#E2E2E6"
GRUB_LOGO="#0C0C0E"
# frame = zaznaczona pozycja w ramce akcentu; bar = kreska akcentu po lewej.
GRUB_SELECT="bar"
