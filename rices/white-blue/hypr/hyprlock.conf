# archenemy - hyprlock.conf (0.1 rice)
# made by kst - https://github.com/ksterajewicz

general {
    hide_cursor       = true
    ignore_empty_input = true
}

# Tło (warstwa maszynowa — Super+W -> "Set as hyprlock background" je zmienia
# bez ruszania tego pliku; generowane przez install.sh [8h] przy pierwszym
# biegu).
source = ~/archenemy/config/hypr/hyprlock-background-white-blue.conf

# ─── Clock ────────────────────────────────────────────
label {
    monitor =
    text          = $TIME
    color         = rgba(255, 255, 255, 0.95)
    font_size     = 96
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 160
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_color  = rgba(1, 72, 237, 0.35)
}

label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(255, 255, 255, 0.75)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
}

# ─── Password field ──────────────────────────────────
input-field {
    monitor =
    size              = 300, 52
    position          = 0, -80
    halign            = center
    valign            = center

    rounding          = 14
    outline_thickness = 2

    inner_color       = rgba(255, 255, 255, 0.35)
    outer_color       = rgba(1, 72, 237, 0.55)
    check_color       = rgba(74, 127, 255, 0.9)
    fail_color        = rgba(217, 48, 37, 0.9)
    font_color        = rgb(10, 10, 10)

    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>password…</i>
    fail_text         = <i>wrong ($ATTEMPTS)</i>

    dots_size         = 0.25
    dots_spacing      = 0.25
    dots_center       = true

    fade_on_empty     = true
    fade_timeout      = 1500
}
