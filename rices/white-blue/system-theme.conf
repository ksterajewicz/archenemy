# archenemy - system-theme.conf (white-blue rice)
# Deklaracja: wygląd tego rice'a poza sesją — ekran logowania SDDM i menu
# startu GRUB-a. Czyta src/system-theme/build.sh (plik jest czytany jako
# dane, nigdy wykonywany). NIE jest symlinkowany do ~/.config (przełącznik
# linkuje tylko katalogi) — to metadane rice'a, nie config aplikacji.
# Układ ekranu logowania: src/system-theme/sddm/white-blue/.
#
# Tło ekranu logowania, gdy użytkownik nie ustawił własnej tapety:
# plik dla ekranów 16:9 i szerszych oraz dla wyższych (16:10).
SDDM_WALLPAPER_169="wallpapers/blue-hex/blue-hex-v1-1920x1080.png"
SDDM_WALLPAPER_1610="wallpapers/blue-hex/blue-hex-v2-2560x1600.png"
# Menu GRUB-a: jednolite tło, logo systemu, lista. Paleta white-blue:
# jasne tło #F7F9FC, niebieski #0148ED jako akcent, ciemny tekst.
GRUB_BACKGROUND="#F7F9FC"
GRUB_TEXT="#5E6875"
GRUB_SELECTED="#0A0A0A"
GRUB_DIM="#9AA5B1"
GRUB_ACCENT="#0148ED"
GRUB_FILL="#E3EAF5"
GRUB_LOGO="#0148ED"
# frame = zaznaczona pozycja w ramce akcentu; bar = kreska akcentu po lewej.
GRUB_SELECT="bar"
