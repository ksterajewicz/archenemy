# archenemy - hyprlock.conf (dither-flux rice)
# made by kst - https://github.com/ksterajewicz

general {
    hide_cursor       = true
    ignore_empty_input = true
}

# Tło (warstwa maszynowa — Super+W -> "Set as hyprlock background" je zmienia
# bez ruszania tego pliku; generowane przez install.sh [8h] przy pierwszym
# biegu, z brightness=0.70 — przygaszone jak fiord w ulewie, ale raster
# tapety ma zostać czytelny).
source = ~/archenemy/config/hypr/hyprlock-background-dither-flux.conf

# ─── Dwie linie w kolorze wody ramujące zegar (1 px — jak ramki okien) ──
shape {
    monitor     =
    size        = 560, 1
    color       = rgba(92, 135, 163, 0.70)
    rounding    = 0
    border_size = 0
    position    = 0, 258
    halign      = center
    valign      = center
}
shape {
    monitor     =
    size        = 560, 1
    color       = rgba(92, 135, 163, 0.70)
    rounding    = 0
    border_size = 0
    position    = 0, 92
    halign      = center
    valign      = center
}

# ─── Clock ────────────────────────────────────────────
label {
    monitor =
    text          = $TIME
    # Piana — najjaśniejszy kolor palety; bez poświaty (raster nie zna glow).
    color         = rgba(216, 230, 238, 0.97)
    font_size     = 100
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 175
    halign        = center
    valign        = center
}

label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(216, 230, 238, 0.85)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 52
    halign      = center
    valign      = center
}

# ─── Tagline ─────────────────────────────────────────
label {
    monitor       =
    text          = · D I T H E R   F L U X ·
    color         = rgba(92, 135, 163, 0.75)
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 18
    halign        = center
    valign        = center
}

# ─── Password field ──────────────────────────────────
input-field {
    monitor =
    size              = 300, 52
    position          = 0, -80
    halign            = center
    valign            = center

    rounding          = 0
    outline_thickness = 1

    inner_color       = rgba(15, 26, 36, 0.55)
    outer_color       = rgba(92, 135, 163, 0.85)
    check_color       = rgba(168, 196, 212, 0.9)
    # Fail w bursztynie — jedyny ciepły kolor palety, zarezerwowany dla alarmów.
    fail_color        = rgba(224, 162, 60, 0.9)
    font_color        = rgb(216, 230, 238)

    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>password…</i>
    fail_text         = <i>wrong ($ATTEMPTS)</i>

    dots_size         = 0.25
    dots_spacing      = 0.25
    dots_center       = true

    fade_on_empty     = true
    fade_timeout      = 1500
}
