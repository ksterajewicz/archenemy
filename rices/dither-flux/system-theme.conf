# archenemy - system-theme.conf (dither-flux rice)
# Deklaracja: wygląd tego rice'a poza sesją — ekran logowania SDDM i menu
# startu GRUB-a. Czyta src/system-theme/build.sh (plik jest czytany jako
# dane, nigdy wykonywany). NIE jest symlinkowany do ~/.config (przełącznik
# linkuje tylko katalogi) — to metadane rice'a, nie config aplikacji.
# Układ ekranu logowania: src/system-theme/sddm/dither-flux/.
#
# Rice nie ma stałej tapety w repo: bez tapety użytkownika ekran logowania
# rysuje tło sam (brak kluczy SDDM_WALLPAPER_*).
# Menu GRUB-a: jednolite tło, logo systemu, lista. Paleta dither-flux:
# tło #0F1A24, atrament #5C87A3, papier #D8E6EE; krawędzie proste, 1 px.
GRUB_BACKGROUND="#0F1A24"
GRUB_TEXT="#5C87A3"
GRUB_SELECTED="#D8E6EE"
GRUB_DIM="#3E5C70"
GRUB_ACCENT="#5C87A3"
GRUB_FILL="#14222E"
GRUB_LOGO="#D8E6EE"
# frame = zaznaczona pozycja w ramce akcentu; bar = kreska akcentu po lewej.
GRUB_SELECT="frame"
