# =============================================
#   archenemy · dither-flux · Starship
#   Tło terminala: #0F1A24; tylko szybkie moduły i znaki ASCII.
# =============================================
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = '$directory$git_branch$git_status$cmd_duration$line_break$character'
scan_timeout = 30
command_timeout = 200

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#A8C4D4'
read_only = ' ro'
read_only_style = '#C96A5A'
truncation_length = 3
truncation_symbol = '../'

[git_branch]
format = '[$symbol$branch]($style) '
symbol = 'git:'
style = '#7FA383'
truncation_length = 28
truncation_symbol = '...'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = '#C96A5A'
conflicted = '='
ahead = 'a${count}'
behind = 'b${count}'
diverged = 'a${ahead_count}/b${behind_count}'
up_to_date = ''
untracked = '?'
stashed = 's'
modified = '!'
staged = '+'
renamed = 'r'
deleted = 'x'
ignore_submodules = true

[cmd_duration]
format = '[$duration]($style) '
min_time = 2000
style = '#5C87A3'
show_notifications = false

[character]
format = '$symbol '
success_symbol = '[>](#A8C4D4)'
error_symbol = '[!](#C96A5A)'
vimcmd_symbol = '[<](#A8C4D4)'
vimcmd_replace_one_symbol = '[r](#C96A5A)'
vimcmd_replace_symbol = '[R](#C96A5A)'
vimcmd_visual_symbol = '[v](#A8C4D4)'
