# archenemy - flux-wall.conf (dither-flux rice)
# Deklaracja: ten rice używa tapety liczonej shaderem (flux-wall) — nad tapetą
# hyprpapera, pod oknami. Czyta scripts/wallpapers/flux-wall.sh. Plik NIE jest
# symlinkowany do ~/.config (przełącznik linkuje tylko katalogi) — to metadane
# rice'a, nie config aplikacji.
#
# Paleta milford-woda: mokre góry, stalowa woda, piana jako akcent.
# Te same trzy kolory, którymi generator PNG maluje tapety statyczne.
FLUX_WALL_PALETTE="0F1A24,5C87A3,D8E6EE"
FLUX_WALL_SHADER="src/flux-wall/shaders/dither-flux.frag"
# --battery: szczegółowość i tempo maleją wraz z poziomem baterii.
# Dopisz np. "-f 30" (limit klatek) albo "--once" (kadr statyczny).
FLUX_WALL_ARGS="--battery"
# 1 = animacja domyślnie WŁĄCZONA w tym ricu (bez wyboru w Super+W).
# Wybór użytkownika w data/flux-wall.dat ma pierwszeństwo.
FLUX_WALL_AUTOSTART=1
