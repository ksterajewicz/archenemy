# archenemy - system-theme.conf (yin rice)
# Deklaracja: wygląd tego rice'a poza sesją — ekran logowania SDDM i menu
# startu GRUB-a. Czyta src/system-theme/build.sh (plik jest czytany jako
# dane, nigdy wykonywany). NIE jest symlinkowany do ~/.config (przełącznik
# linkuje tylko katalogi) — to metadane rice'a, nie config aplikacji.
# Układ ekranu logowania: src/system-theme/sddm/yin/.
#
# Tło ekranu logowania: formularz yin jest wpasowany w tarczę zaćmienia,
# więc te dwa pliki są tłem zawsze (theme.conf: followWallpaper=0).
SDDM_WALLPAPER_169="wallpapers/yin/yin-eclipse-v1-1920x1080.png"
SDDM_WALLPAPER_1610="wallpapers/yin/yin-eclipse-v2-2560x1600.png"
# Menu GRUB-a: jednolite tło, logo systemu, lista. Paleta yin: pustka
# #0C0C0E, popiół #8C8C96, biel jako jedyny akcent.
GRUB_BACKGROUND="#0C0C0E"
GRUB_TEXT="#8C8C96"
GRUB_SELECTED="#FFFFFF"
GRUB_DIM="#5E5E66"
GRUB_ACCENT="#FFFFFF"
GRUB_FILL="#1E1E22"
GRUB_LOGO="#FFFFFF"
# bar = kreska akcentu po lewej; frame = zaznaczona pozycja w ramce akcentu.
GRUB_SELECT="bar"
