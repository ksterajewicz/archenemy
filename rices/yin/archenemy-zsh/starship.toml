# =============================================
#   archenemy · yin · Starship
#   Tło terminala: #0C0C0E; tylko szybkie moduły i znaki ASCII.
#   Monochrom; żar #E0805A tylko dla błędu (error_symbol, ro).
# =============================================
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = '$directory$git_branch$git_status$cmd_duration$line_break$character'
scan_timeout = 30
command_timeout = 200

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#FFFFFF'
read_only = ' ro'
read_only_style = '#E0805A'
truncation_length = 3
truncation_symbol = '../'

[git_branch]
format = '[$symbol$branch]($style) '
symbol = 'git:'
style = '#D7D7DC'
truncation_length = 28
truncation_symbol = '...'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = '#B6B6BD'
conflicted = '='
ahead = 'a${count}'
behind = 'b${count}'
diverged = 'a${ahead_count}/b${behind_count}'
up_to_date = ''
untracked = '?'
stashed = 's'
modified = '!'
staged = '+'
renamed = 'r'
deleted = 'x'
ignore_submodules = true

[cmd_duration]
format = '[$duration]($style) '
min_time = 2000
style = '#868690'
show_notifications = false

[character]
format = '$symbol '
success_symbol = '[>](#FFFFFF)'
error_symbol = '[!](#E0805A)'
vimcmd_symbol = '[<](#FFFFFF)'
vimcmd_replace_one_symbol = '[r](#B6B6BD)'
vimcmd_replace_symbol = '[R](#B6B6BD)'
vimcmd_visual_symbol = '[v](#FFFFFF)'
