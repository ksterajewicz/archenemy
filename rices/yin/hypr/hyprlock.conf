# archenemy - hyprlock.conf (yin rice)
# made by kst - https://github.com/ksterajewicz

general {
    hide_cursor       = true
    ignore_empty_input = true
}

# Tło (warstwa maszynowa — Super+W -> "Set as hyprlock background" je zmienia
# bez ruszania tego pliku; generowane przez install.sh [8h] przy pierwszym
# biegu, z brightness=0.60 — przygaszony, rozmyty pulpit, nad nim tafla szkła).
source = ~/archenemy/config/hypr/hyprlock-background-yin.conf

# ─── Tafla matowego szkła pod zegarem i polem hasła ───
# Grafit z alfą 0.55 nad rozmytym tłem, krawędź = biała linia 1 px (alfa 0.12),
# miękki czarny cień. Rogi 24 px = 2 × promień okien (większa tafla).
shape {
    monitor       =
    size          = 520, 400
    color         = rgba(18, 18, 21, 0.55)
    rounding      = 24
    border_size   = 1
    border_color  = rgba(255, 255, 255, 0.12)
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.50)
    position      = 0, 60
    halign        = center
    valign        = center
}

# ─── Clock ────────────────────────────────────────────
label {
    monitor =
    text        = $TIME
    # Biel — akcent rice'a; bez poświaty (yin to szkło, nie neon).
    color       = rgba(255, 255, 255, 1.0)
    font_size   = 96
    font_family = JetBrainsMono Nerd Font
    position    = 0, 160
    halign      = center
    valign      = center
}

label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(182, 182, 189, 0.95)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 52
    halign      = center
    valign      = center
}

# ─── Tagline ─────────────────────────────────────────
label {
    monitor       =
    text          = · Y I N ·
    color         = rgba(140, 140, 150, 0.90)
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 16
    halign        = center
    valign        = center
}

# ─── Password field ──────────────────────────────────
input-field {
    monitor =
    size              = 300, 52
    position          = 0, -80
    halign            = center
    valign            = center

    rounding          = 12
    outline_thickness = 1

    inner_color       = rgba(12, 12, 14, 0.60)
    outer_color       = rgba(255, 255, 255, 0.35)
    check_color       = rgba(182, 182, 189, 0.90)
    # Fail w żarze — jedyny ciepły kolor palety, wyłącznie alarmy.
    fail_color        = rgba(224, 128, 90, 0.95)
    font_color        = rgb(255, 255, 255)

    font_family       = JetBrainsMono Nerd Font
    placeholder_text  = <i>password…</i>
    fail_text         = <i>wrong ($ATTEMPTS)</i>

    dots_size         = 0.25
    dots_spacing      = 0.25
    dots_center       = true

    fade_on_empty     = true
    fade_timeout      = 1500
}
